name: vista
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Scientific core
  - gdal          # osgeo bindings for the viewshed engine
  - rasterio
  - affine
  - pyproj
  - shapely
  - numpy
  - matplotlib
  - requests      # OpenTopography DEM download
  # Graphical application
  - PySide6
  # Tests
  - pytest
  - pillow
