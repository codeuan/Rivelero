name: vista
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core scientific stack used by the current application
  - gdal          # osgeo bindings for the viewshed engine
  - rasterio
  - affine
  - pyproj
  - shapely
  - numpy
  - matplotlib
  - requests      # OpenTopography DEM download
  # Graphical application
  - PySide6
  # Tests
  - pytest
  - pillow
  # Used only by legacy modules (src/GUI, src/soe, rivelero.design,
  # rivelero.suitability, rivelero.visibility.obstacles, io/osm.py);
  # not needed by the current application.
  - geopandas
  - osmnx
  - OpenEXR
  - psutil
  - python-dateutil
  # Not imported anywhere in the repository (candidates for removal).
  - scikit-learn
  - lark
